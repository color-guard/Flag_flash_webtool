; PlatformIO Project Configuration File
; 使っているESP32-C3ボードに合わせて board / build_flags を調整すること

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    adafruit/Adafruit NeoPixel@^1.12.3

; 一部のESP32-C3ボード（USB-UARTブリッジチップを積まずCDCで直接USB接続するタイプ）は
; 以下のUSB CDC関連フラグが必要。CP2102等の外付けUSBシリアルチップを積んだボードでは
; 不要な場合があるので、Serial出力が化ける/出ない場合はコメントアウトして試すこと。
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
