; PlatformIO Project Configuration File
;
; 複数ボードに対応するため、共通設定は[env]に、ボード固有の設定だけ各[env:xxx]に書く。
; ビルド/書き込み対象は `pio run -e <環境名>` で指定する。
; 何も指定しなければ default_envs に書いた環境が使われる。

[platformio]
default_envs = seeed_xiao_esp32c3

[env]
framework = arduino
monitor_speed = 115200

; NimBLE-Arduinoは2.x系を使用。ESP32-C6に必要な新しいArduinoコア(3.x系)は
; NimBLE-Arduino 1.x系とは構造が合わず esp_coexist_internal.h 等のビルドエラーになる。
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
    adafruit/Adafruit NeoPixel@^1.12.3

; XIAOシリーズ(ESP32C3/C6共通)はUSB-UARTブリッジチップを搭載せず、USB-C端子が
; チップのネイティブUSB(CDC)に直結されている。そのため以下のフラグが必須。
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---- 本番機: Seeed Studio XIAO ESP32C3 ----
[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3

; ---- テスト機: Seeed Studio XIAO ESP32C6 ----
[env:seeed_xiao_esp32c6]
platform = espressif32
board = seeed_xiao_esp32c6